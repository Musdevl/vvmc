<div class="app">
  <app-home
    *ngIf="currentScreen === 'home'"
    (start)="goToSetup()"
  ></app-home>

  <app-setup
    *ngIf="currentScreen === 'setup'"
    (startGame)="startGame($event)"
  ></app-setup>

  <app-game
    *ngIf="currentScreen === 'game'"
    (gameEnd)="goToEnd()"
  ></app-game>

  <app-end
    *ngIf="currentScreen === 'end'"
    (replay)="goToHome()"
  ></app-end>
</div>
